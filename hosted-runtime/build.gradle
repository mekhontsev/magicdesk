plugins { id 'com.android.library' }

def termux = System.getenv('PREFIX')?.startsWith('/data/data/') && file("${System.getenv('PREFIX')}/bin/clang").isFile()
def nativeDirectory = layout.buildDirectory.dir('graphics').get().asFile
def jniDirectory = layout.buildDirectory.dir('jniLibs').get().asFile

android {
    namespace 'io.github.mekhontsev.magicdesk.hosted'
    compileSdk 37
    ndkVersion '27.3.13750724'
    defaultConfig {
        minSdk 34
        ndk { abiFilters 'arm64-v8a' }
        consumerProguardFiles 'consumer-rules.pro'
    }
    sourceSets.main.jniLibs.srcDir jniDirectory
    buildFeatures { aidl true }
    if (!termux) externalNativeBuild { cmake { path 'src/main/cpp/presentation/CMakeLists.txt' } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { testImplementation 'junit:junit:4.13.2' }

if (termux) {
    def configure = tasks.register('configureGraphics', Exec) {
        inputs.files 'src/main/cpp/presentation/CMakeLists.txt', 'src/main/cpp/graphics/CMakeLists.txt'
        outputs.file new File(nativeDirectory, 'build.ninja')
        commandLine 'cmake', '-S', file('src/main/cpp/presentation'), '-B', nativeDirectory, '-G', 'Ninja',
                '-DCMAKE_C_COMPILER=clang', '-DCMAKE_C_FLAGS=--target=aarch64-linux-android34',
                "-DJNI_INCLUDE_DIR=${System.getProperty('java.home')}/include",
                '-DCMAKE_SHARED_LINKER_FLAGS=-L/system/lib64 -fno-termux-rpath -Wl,-z,max-page-size=16384'
    }
    def build = tasks.register('buildGraphics', Exec) {
        dependsOn configure
        commandLine 'cmake', '--build', nativeDirectory, '-j', '4'
    }
    def collect = tasks.register('packageGraphics', Sync) {
        dependsOn build
        from new File(nativeDirectory, 'libmagicdesk_graphics_host.so')
        into new File(jniDirectory, 'arm64-v8a')
    }
    tasks.named('preBuild').configure { dependsOn collect }
}
