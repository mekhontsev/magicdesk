plugins {
    id 'com.android.application'
}

android {
    namespace = 'io.github.mekhontsev.magicdesk'
    compileSdk = 37

    defaultConfig {
        applicationId = 'io.github.mekhontsev.magicdesk'
        minSdk = 36
        targetSdk = 36
        versionCode = 160
        versionName = '1.6.0'
    }

    androidComponents {
        onVariants(selector().all()) { variant ->
            variant.outputs.forEach { output ->
                output.outputFileName.set("MagicDesk 10s Pro 1.6.0.apk")
            }
        }
    }

    buildFeatures {
        aidl = true
        buildConfig = true
    }

    packagingOptions {
        jniLibs {
            // Shell launches the extracted helpers from nativeLibraryDir.
            useLegacyPackaging = true
            keepDebugSymbols += [
                    '**/libmagicdesk_uinput_bridge.so',
                    '**/libmagicdesk_keyboard_bridge.so'
            ]
        }
    }

    sourceSets {
        main {
            jniLibs.srcDir file("$buildDir/generated/magicdeskNative")
        }
    }
}

def termuxPrefix = System.getenv('PREFIX') ?: '/data/data/com.termux/files/usr'
def termuxCompiler = file("${termuxPrefix}/bin/clang")
def inputSourcesSource =
        rootProject.file('native/magicdesk_input_sources.c')
def inputSourcesHeader =
        rootProject.file('native/magicdesk_input_sources.h')
def uinputBridgeSource = rootProject.file('native/magicdesk_uinput_bridge.c')
def uinputBridgeOutput = file(
        "$buildDir/generated/magicdeskNative/arm64-v8a/libmagicdesk_uinput_bridge.so")
def keyboardBridgeSource =
        rootProject.file('native/magicdesk_keyboard_bridge.c')
def keyboardBridgeOutput = file(
        "$buildDir/generated/magicdeskNative/arm64-v8a/libmagicdesk_keyboard_bridge.so")

def resolveNativeCompilerCommand = {
    if (termuxCompiler.isFile()
            && termuxPrefix.startsWith('/data/data/com.termux/')) {
        return [termuxCompiler.absolutePath]
    }
    def ndkHome = System.getenv('ANDROID_NDK_HOME')
            ?: System.getenv('ANDROID_NDK_ROOT')
    if (ndkHome == null || ndkHome.isBlank()) {
        throw new GradleException(
                'ANDROID_NDK_HOME is required to build the input helpers')
    }

    // Detección automática del sistema operativo para el NDK
    def hostTag = 'linux-x86_64'
    def osName = System.getProperty('os.name').toLowerCase()
    if (osName.contains('win')) {
        hostTag = 'windows-x86_64'
    } else if (osName.contains('mac')) {
        hostTag = 'darwin-x86_64'
    }

    def ndkCompiler = file("${ndkHome}/toolchains/llvm/prebuilt/${hostTag}"
            + '/bin/aarch64-linux-android35-clang')
    if (!ndkCompiler.isFile()) {
        throw new GradleException("Android NDK compiler not found: ${ndkCompiler}")
    }
    return [ndkCompiler.absolutePath]
}

tasks.register('buildMagicDeskUinputBridge', Exec) {
    inputs.files(uinputBridgeSource, inputSourcesSource, inputSourcesHeader)
    outputs.file(uinputBridgeOutput)
    doFirst {
        uinputBridgeOutput.parentFile.mkdirs()
        def compilerCommand = resolveNativeCompilerCommand()
        compilerCommand.addAll([
                '-std=c17', '-O2', '-Wall', '-Wextra', '-Werror',
                '-fPIE', '-pie', '-Wl,-z,noexecstack',
                '-o', uinputBridgeOutput.absolutePath,
                uinputBridgeSource.absolutePath,
                inputSourcesSource.absolutePath
        ])
        if (System.getProperty('os.name').toLowerCase().contains('win')) {
            commandLine 'cmd', '/c'
            args compilerCommand
        } else {
            commandLine compilerCommand
        }
    }
}

tasks.register('buildMagicDeskKeyboardBridge', Exec) {
    inputs.files(keyboardBridgeSource, inputSourcesSource, inputSourcesHeader)
    outputs.file(keyboardBridgeOutput)
    doFirst {
        keyboardBridgeOutput.parentFile.mkdirs()
        def compilerCommand = resolveNativeCompilerCommand()
        compilerCommand.addAll([
                '-std=c17', '-O2', '-Wall', '-Wextra', '-Werror',
                '-fPIE', '-pie', '-Wl,-z,noexecstack',
                '-o', keyboardBridgeOutput.absolutePath,
                keyboardBridgeSource.absolutePath,
                inputSourcesSource.absolutePath
        ])
        if (System.getProperty('os.name').toLowerCase().contains('win')) {
            commandLine 'cmd', '/c'
            args compilerCommand
        } else {
            commandLine compilerCommand
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('buildMagicDeskUinputBridge')
    dependsOn tasks.named('buildMagicDeskKeyboardBridge')
}

dependencies {
    compileOnly 'androidx.annotation:annotation:1.3.0'
    implementation('dev.rikka.shizuku:api:13.1.5') {
        exclude group: 'androidx.annotation', module: 'annotation'
    }
    implementation('dev.rikka.shizuku:provider:13.1.5') {
        exclude group: 'androidx.annotation', module: 'annotation'
    }
    compileOnly project(':hidden-api-stubs')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

apply from: rootProject.file('gradle/release-signing.gradle')