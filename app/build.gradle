plugins {
    id 'com.android.application'
}

android {
    namespace = 'io.github.mekhontsev.magicdesk'
    compileSdk = 37

    defaultConfig {
        applicationId = 'io.github.mekhontsev.magicdesk'
        minSdk = 36
        targetSdk = 36
        versionCode = 100
        versionName = '1.0'
    }

    buildFeatures {
        aidl = true
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += [
                    '**/libmagicdesk_mouse_remap.so',
                    '**/libmagicdesk_uinput_bridge.so'
            ]
        }
    }

    sourceSets {
        main {
            jniLibs.srcDir file("$buildDir/generated/magicdeskNative")
        }
    }
}

def termuxPrefix = System.getenv('PREFIX') ?: '/data/data/com.termux/files/usr'
def termuxCompiler = file("${termuxPrefix}/bin/clang")
def mouseRemapSource = rootProject.file('native/magicdesk_mouse_remap.c')
def mouseRemapOutput = file(
        "$buildDir/generated/magicdeskNative/arm64-v8a/libmagicdesk_mouse_remap.so")
def uinputBridgeSource = rootProject.file('native/magicdesk_uinput_bridge.c')
def uinputBridgeOutput = file(
        "$buildDir/generated/magicdeskNative/arm64-v8a/libmagicdesk_uinput_bridge.so")

def resolveNativeCompilerCommand = {
    if (termuxCompiler.isFile()
            && termuxPrefix.startsWith('/data/data/com.termux/')) {
        return [termuxCompiler.absolutePath]
    }
    def ndkHome = System.getenv('ANDROID_NDK_HOME')
            ?: System.getenv('ANDROID_NDK_ROOT')
    if (ndkHome == null || ndkHome.isBlank()) {
        throw new GradleException(
                'ANDROID_NDK_HOME is required to build the mouse remap helper')
    }
    def ndkCompiler = file("${ndkHome}/toolchains/llvm/prebuilt/linux-x86_64"
            + '/bin/aarch64-linux-android35-clang')
    if (!ndkCompiler.isFile()) {
        throw new GradleException("Android NDK compiler not found: ${ndkCompiler}")
    }
    return [ndkCompiler.absolutePath]
}

tasks.register('buildMagicDeskMouseRemap', Exec) {
    inputs.file(mouseRemapSource)
    outputs.file(mouseRemapOutput)
    doFirst {
        mouseRemapOutput.parentFile.mkdirs()
        def compilerCommand = resolveNativeCompilerCommand()
        compilerCommand.addAll([
                '-std=c17', '-O2', '-Wall', '-Wextra', '-Werror',
                '-fPIE', '-pie', '-Wl,-z,noexecstack',
                '-o', mouseRemapOutput.absolutePath,
                mouseRemapSource.absolutePath
        ])
        commandLine compilerCommand
    }
}

tasks.register('buildMagicDeskUinputBridge', Exec) {
    inputs.file(uinputBridgeSource)
    outputs.file(uinputBridgeOutput)
    doFirst {
        uinputBridgeOutput.parentFile.mkdirs()
        def compilerCommand = resolveNativeCompilerCommand()
        compilerCommand.addAll([
                '-std=c17', '-O2', '-Wall', '-Wextra', '-Werror',
                '-fPIE', '-pie', '-Wl,-z,noexecstack',
                '-o', uinputBridgeOutput.absolutePath,
                uinputBridgeSource.absolutePath
        ])
        commandLine compilerCommand
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('buildMagicDeskMouseRemap')
    dependsOn tasks.named('buildMagicDeskUinputBridge')
}

dependencies {
    compileOnly 'androidx.annotation:annotation:1.3.0'
    implementation('dev.rikka.shizuku:api:13.1.5') {
        exclude group: 'androidx.annotation', module: 'annotation'
    }
    implementation('dev.rikka.shizuku:provider:13.1.5') {
        exclude group: 'androidx.annotation', module: 'annotation'
    }
    compileOnly project(':hidden-api-stubs')
    testImplementation 'junit:junit:4.13.2'
}

apply from: rootProject.file('gradle/release-signing.gradle')
