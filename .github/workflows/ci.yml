name: Android CI

on:
  push:
    branches:
      - main
      - next/1.8
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.3.13750724

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Reject tracked local files
        shell: bash
        run: |
          tracked_ignored=$(git ls-files -ci --exclude-standard)
          if [[ -n "$tracked_ignored" ]]; then
            echo "::error::Tracked files match repository ignore rules"
            printf '%s\n' "$tracked_ignored"
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate Android SDK components
        shell: bash
        run: |
          test -f "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/37.0.0/aapt2"
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"

      - name: Verify development version
        shell: bash
        run: |
          latest_tag=$(git tag --list 'v[0-9]*' --sort=-v:refname \
            | sed -n '1p')
          test -n "$latest_tag"
          released_version=$(printf '%s' "$latest_tag" | cut -c2-)
          current_version=$(awk -F= \
            '$1 == "magicDeskVersionName" {print $2; exit}' \
            gradle.properties)
          current_code=$(awk -F= \
            '$1 == "magicDeskVersionCode" {print $2; exit}' \
            gradle.properties)
          released_properties=$(git show \
            "$latest_tag:gradle.properties" 2>/dev/null || true)
          released_code=$(printf '%s\n' "$released_properties" | awk -F= \
            '$1 == "magicDeskVersionCode" {print $2; exit}')
          if [[ -z "$released_code" ]]; then
            released_code=$(git show "$latest_tag:app/build.gradle" \
              | awk '$1 == "versionCode" {print $3; exit}')
          fi
          highest_version=$(printf '%s\n%s\n' \
            "$released_version" "$current_version" | sort -V | tail -n 1)
          if [[ "$current_version" == "$released_version" \
                || "$highest_version" != "$current_version" ]]; then
            echo "::error::Development version $current_version must be newer than $released_version"
            exit 1
          fi
          if (( current_code <= released_code )); then
            echo "::error::Development versionCode $current_code must be greater than $released_code"
            exit 1
          fi
          printf 'Development %s (%s) follows %s (%s).\n' \
            "$current_version" "$current_code" \
            "$released_version" "$released_code"

      - name: Restore release keystore
        if: github.event_name == 'push'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.MAGICDESK_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          install -d -m 700 "$RUNNER_TEMP/magicdesk-signing"
          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/magicdesk-signing/release.jks"
          chmod 600 "$RUNNER_TEMP/magicdesk-signing/release.jks"

      - name: Lint and build signed APKs
        if: github.event_name == 'push'
        env:
          ORG_GRADLE_PROJECT_MAGICDESK_RELEASE_STORE_FILE: ${{ runner.temp }}/magicdesk-signing/release.jks
          ORG_GRADLE_PROJECT_MAGICDESK_RELEASE_STORE_PASSWORD: ${{ secrets.MAGICDESK_RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_MAGICDESK_RELEASE_KEY_ALIAS: ${{ secrets.MAGICDESK_RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_MAGICDESK_RELEASE_KEY_PASSWORD: ${{ secrets.MAGICDESK_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          short_sha=$(printf '%s' "$GITHUB_SHA" | cut -c1-7)
          version_suffix="dev.$GITHUB_RUN_NUMBER.$short_sha"
          ./gradlew --no-daemon \
            -PMAGICDESK_VERSION_SUFFIX="$version_suffix" \
            :app:testDebugUnitTest \
            :app:lintRelease \
            :kernel-fixes:lintRelease \
            :app:assembleRelease \
            :kernel-fixes:assembleRelease

      - name: Lint and build unsigned release APKs
        if: github.event_name != 'push'
        run: |
          ./gradlew --no-daemon \
            :app:testDebugUnitTest \
            :app:lintRelease \
            :kernel-fixes:lintRelease \
            :app:assembleRelease \
            :kernel-fixes:assembleRelease

      - name: Verify signed APK and package boundaries
        if: github.event_name == 'push'
        shell: bash
        run: |
          build_tools="$ANDROID_SDK_ROOT/build-tools/37.0.0"
          core_apk=app/build/outputs/apk/release/app-release.apk
          "$build_tools/apksigner" verify --verbose "$core_apk"
          ./scripts/verify-apks.sh \
            "$core_apk" \
            kernel-fixes/build/outputs/apk/release/kernel-fixes-release.apk

      - name: Verify unsigned APK boundaries
        if: github.event_name != 'push'
        run: |
          ./scripts/verify-apks.sh \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            kernel-fixes/build/outputs/apk/release/kernel-fixes-release-unsigned.apk

      - name: Prepare signed main artifact
        if: github.event_name == 'push'
        shell: bash
        run: |
          build_tools="$ANDROID_SDK_ROOT/build-tools/37.0.0"
          core_apk=app/build/outputs/apk/release/app-release.apk
          version=$("$build_tools/aapt2" dump badging "$core_apk" \
            | awk -F "versionName='" 'NR == 1 {split($2, value, "'\''"); print value[1]}')
          test -n "$version"
          mkdir -p dist
          cp "$core_apk" "dist/MagicDesk-$version.apk"
          printf 'commit=%s\nrun=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            > dist/BUILD.txt
          (
            cd dist
            sha256sum ./*.apk > SHA256SUMS
          )

      - name: Upload signed development APKs
        if: github.event_name == 'push'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: magicdesk-main-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: dist/

      - name: Upload unsigned CI APKs and lint reports
        if: github.event_name != 'push'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: magicdesk-ci-unsigned
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            kernel-fixes/build/outputs/apk/release/kernel-fixes-release-unsigned.apk
            app/build/reports/lint-results-release.html
            kernel-fixes/build/reports/lint-results-release.html

  windows-smoke:
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate Android SDK components
        shell: pwsh
        run: |
          $required = @(
            "$env:ANDROID_SDK_ROOT\platforms\android-37.0\android.jar",
            "$env:ANDROID_SDK_ROOT\build-tools\37.0.0\aapt2.exe",
            "$env:ANDROID_SDK_ROOT\ndk\27.3.13750724\toolchains\llvm\prebuilt\windows-x86_64\bin\clang.exe"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Required Android SDK component not found: $path"
            }
          }

      - name: Verify Windows build
        shell: pwsh
        run: .\gradlew.bat --no-daemon verifyDevelopment

  publish-development:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build
      - windows-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download verified signed APKs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p download
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "magicdesk-main-$GITHUB_RUN_NUMBER" \
            --dir download

      - name: Prepare stable development assets
        shell: bash
        run: |
          mapfile -t apks < <(find download -type f \
            -name 'MagicDesk-*.apk' -print)
          if (( ${#apks[@]} != 1 )); then
            echo "::error::Expected one signed MagicDesk APK, found ${#apks[@]}"
            exit 1
          fi
          source_apk=${apks[0]}
          source_name=$(basename "$source_apk")
          version=${source_name#MagicDesk-}
          version=${version%.apk}
          test -n "$version"

          mkdir -p dist
          cp "$source_apk" dist/MagicDesk-development.apk
          printf 'version=%s\ncommit=%s\nrun=%s\n' \
            "$version" "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            > dist/BUILD.txt
          (
            cd dist
            sha256sum ./*.apk > SHA256SUMS
          )
          cat > development-notes.md <<EOF
          This is the latest release-signed development build from \`main\`.
          It contains unreleased code and may be less stable than a numbered release.

          - Version: \`$version\`
          - Commit: [\`${GITHUB_SHA:0:7}\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)
          - CI run: [\`$GITHUB_RUN_NUMBER\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)

          MagicDesk includes first-class multi-window Termux integration. Each
          Termux-backed Console is an independent native Android desktop window
          with its own PTY, shell, lifecycle, saved geometry, and live foreground
          program label.

          The APK uses the same signing certificate as official MagicDesk releases.
          EOF
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Publish rolling development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag=development
          if gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" \
              >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
          fi

          if gh release view "$tag" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete-asset "$tag" DisplayFixes-development.apk \
              --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 || true
            gh release upload "$tag" dist/* \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "MagicDesk development build" \
              --notes-file development-notes.md \
              --target "$GITHUB_SHA" \
              --prerelease --latest=false
          else
            gh release create "$tag" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "MagicDesk development build" \
              --notes-file development-notes.md \
              --target "$GITHUB_SHA" \
              --prerelease --latest=false
          fi
