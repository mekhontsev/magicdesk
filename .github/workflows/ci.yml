name: Android CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.3.13750724

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Reject tracked local files
        shell: bash
        run: |
          tracked_ignored=$(git ls-files -ci --exclude-standard)
          if [[ -n "$tracked_ignored" ]]; then
            echo "::error::Tracked files match repository ignore rules"
            printf '%s\n' "$tracked_ignored"
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify native host fixtures
        timeout-minutes: 3
        env:
          CC: clang
        run: ./scripts/verify-native.sh

      - name: Validate Android SDK components
        shell: bash
        run: |
          test -f "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/37.0.0/aapt2"
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"

      - name: Verify APK boundary fixtures
        run: python3 -m unittest discover -s scripts/tests -p test_verify_apks.py

      - name: Verify branch and version fixtures
        run: python3 -m unittest discover -s scripts/tests -p test_release_workflow.py

      - name: Verify Wayland build boundary fixtures
        run: python3 -m unittest discover -s scripts/tests -p test_wayland_build.py

      - name: Verify Linux installer fixtures
        run: |
          python3 -m unittest discover -s scripts/tests -p test_install_linux.py
          python3 -m unittest discover -s scripts/tests -p test_flatpak_gl.py
          python3 -m unittest discover -s scripts/tests -p test_recovery_reader.py

      - name: Graphics native host tools
        uses: ./.github/actions/setup-graphics-build

      - name: Verify native shell build with spaces in paths
        shell: bash
        run: |
          build="$RUNNER_TEMP/mksh build with spaces"
          toolchain="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          cmake -S native/android-shell -B "$build" -G Ninja \
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-34
          cmake --build "$build" --parallel 2
          test -f "$build/libmagicdesk_mksh.so"

      - name: Package corresponding source
        run: python3 scripts/package-source.py dist/MagicDesk-source.tar.gz

      - name: Verify branch version
        env:
          VERSION_CHANNEL: ${{ github.base_ref || github.ref_name }}
        shell: bash
        run: |
          python3 scripts/verify-version.py --channel "$VERSION_CHANNEL"

      - name: Verify debug APKs
        run: ./gradlew --no-daemon verifyDevelopment

      - name: Restore release keystore
        if: github.event_name == 'push'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.MAGICDESK_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          install -d -m 700 "$RUNNER_TEMP/magicdesk-signing"
          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/magicdesk-signing/release.jks"
          chmod 600 "$RUNNER_TEMP/magicdesk-signing/release.jks"

      - name: Lint and build signed APKs
        if: github.event_name == 'push'
        env:
          ORG_GRADLE_PROJECT_MAGICDESK_RELEASE_STORE_FILE: ${{ runner.temp }}/magicdesk-signing/release.jks
          ORG_GRADLE_PROJECT_MAGICDESK_RELEASE_STORE_PASSWORD: ${{ secrets.MAGICDESK_RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_MAGICDESK_RELEASE_KEY_ALIAS: ${{ secrets.MAGICDESK_RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_MAGICDESK_RELEASE_KEY_PASSWORD: ${{ secrets.MAGICDESK_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          version_args=()
          if [[ "$GITHUB_REF" == refs/heads/develop ]]; then
            short_sha=$(printf '%s' "$GITHUB_SHA" | cut -c1-7)
            version_args=(-PMAGICDESK_VERSION_SUFFIX="dev.$GITHUB_RUN_NUMBER.$short_sha")
          fi
          ./gradlew --no-daemon \
            "${version_args[@]}" \
            :app:testDebugUnitTest \
            :terminal-emulator:testDebugUnitTest \
            :terminal-emulator:lintRelease \
            :terminal-runtime:lintRelease \
            :connection-runtime:lintRelease \
            :guest-template:lintRelease \
            :x11-runtime:testDebugUnitTest \
            :x11-runtime:lintRelease \
            :hosted-runtime:testDebugUnitTest \
            :hosted-runtime:lintRelease \
            :wayland-runtime:testDebugUnitTest \
            :wayland-runtime:lintRelease \
            :audio-runtime:lintRelease \
            :app:lintRelease \
            :kernel-fixes:lintRelease \
            :app:assembleRelease \
            :kernel-fixes:assembleRelease

      - name: Lint and build unsigned release APKs
        if: github.event_name != 'push'
        run: |
          ./gradlew --no-daemon \
            :app:testDebugUnitTest \
            :terminal-emulator:testDebugUnitTest \
            :terminal-emulator:lintRelease \
            :terminal-runtime:lintRelease \
            :connection-runtime:lintRelease \
            :guest-template:lintRelease \
            :x11-runtime:testDebugUnitTest \
            :x11-runtime:lintRelease \
            :hosted-runtime:testDebugUnitTest \
            :hosted-runtime:lintRelease \
            :wayland-runtime:testDebugUnitTest \
            :wayland-runtime:lintRelease \
            :audio-runtime:lintRelease \
            :app:lintRelease \
            :kernel-fixes:lintRelease \
            :app:assembleRelease \
            :kernel-fixes:assembleRelease

      - name: Verify independent X11 host
        run: ./gradlew --no-daemon -p x11-runtime/example :app:assembleDebug :app:lintDebug

      - name: Verify Android runtime exports
        run: ./gradlew --no-daemon :wayland-runtime:exportRuntime :audio-runtime:exportRuntime

      - name: Verify signed APK and package boundaries
        if: github.event_name == 'push'
        shell: bash
        run: |
          build_tools="$ANDROID_SDK_ROOT/build-tools/37.0.0"
          core_apk=app/build/outputs/apk/release/app-release.apk
          "$build_tools/apksigner" verify --verbose "$core_apk"
          ./scripts/verify-apks.sh \
            "$core_apk" \
            kernel-fixes/build/outputs/apk/release/kernel-fixes-release.apk

      - name: Verify unsigned APK boundaries
        if: github.event_name != 'push'
        run: |
          ./scripts/verify-apks.sh \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            kernel-fixes/build/outputs/apk/release/kernel-fixes-release-unsigned.apk

      - name: Prepare signed branch artifact
        if: github.event_name == 'push'
        shell: bash
        run: |
          build_tools="$ANDROID_SDK_ROOT/build-tools/37.0.0"
          core_apk=app/build/outputs/apk/release/app-release.apk
          version=$("$build_tools/aapt2" dump badging "$core_apk" \
            | awk -F "versionName='" 'NR == 1 {split($2, value, "'\''"); print value[1]}')
          test -n "$version"
          mkdir -p dist
          cp "$core_apk" "dist/MagicDesk-$version.apk"
          printf 'commit=%s\nrun=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            > dist/BUILD.txt
          (
            cd dist
            sha256sum ./*.apk ./*-source.tar.gz > SHA256SUMS
          )

      - name: Upload signed branch APKs
        if: github.event_name == 'push'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: magicdesk-${{ github.ref_name }}-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: dist/

      - name: Upload unsigned CI APKs and lint reports
        if: github.event_name != 'push'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: magicdesk-ci-unsigned
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            kernel-fixes/build/outputs/apk/release/kernel-fixes-release-unsigned.apk
            dist/MagicDesk-source.tar.gz
            app/build/reports/lint-results-release.html
            kernel-fixes/build/reports/lint-results-release.html

      - name: Upload Linux test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: linux-test-reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**

  publish-development:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs:
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download verified signed APKs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p download
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "magicdesk-develop-$GITHUB_RUN_NUMBER" \
            --dir download

      - name: Prepare stable development assets
        shell: bash
        run: |
          mapfile -t apks < <(find download -type f \
            -name 'MagicDesk-*.apk' -print)
          if (( ${#apks[@]} != 1 )); then
            echo "::error::Expected one signed MagicDesk APK, found ${#apks[@]}"
            exit 1
          fi
          source_apk=${apks[0]}
          source_name=$(basename "$source_apk")
          version=${source_name#MagicDesk-}
          version=${version%.apk}
          test -n "$version"

          mkdir -p dist
          cp "$source_apk" dist/MagicDesk-development.apk
          cp download/MagicDesk-source.tar.gz dist/MagicDesk-development-source.tar.gz
          printf 'version=%s\ncommit=%s\nrun=%s\n' \
            "$version" "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            > dist/BUILD.txt
          (
            cd dist
            sha256sum ./*.apk ./*-source.tar.gz > SHA256SUMS
          )
          cat > development-notes.md <<EOF
          This is the latest release-signed development build from \`develop\`.
          The notes below are preliminary. This build may be less stable than a numbered release.

          - Version: \`$version\`
          - Commit: [\`${GITHUB_SHA:0:7}\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)
          - CI run: [\`$GITHUB_RUN_NUMBER\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)

          The APK uses the same signing certificate as official MagicDesk releases.

          EOF
          base_version=${version%%-dev.*}
          tar -xOzf download/MagicDesk-source.tar.gz \
            "MagicDesk/docs/releases/$base_version.md" >> development-notes.md
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Publish rolling development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag=development
          if gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" \
              >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
          fi

          if gh release view "$tag" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "MagicDesk development build" \
              --notes-file development-notes.md \
              --target "$GITHUB_SHA" \
              --prerelease --latest=false
          else
            gh release create "$tag" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "MagicDesk development build" \
              --notes-file development-notes.md \
              --target "$GITHUB_SHA" \
              --prerelease --latest=false
          fi
