name: Android CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.3.13750724

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate Android SDK components
        shell: bash
        run: |
          test -f "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/37.0.0/aapt2"
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"

      - name: Verify development version
        shell: bash
        run: |
          latest_tag=$(git tag --list 'v[0-9]*' --sort=-v:refname \
            | sed -n '1p')
          test -n "$latest_tag"
          released_version=$(printf '%s' "$latest_tag" | cut -c2-)
          current_version=$(awk -F= \
            '$1 == "magicDeskVersionName" {print $2; exit}' \
            gradle.properties)
          current_code=$(awk -F= \
            '$1 == "magicDeskVersionCode" {print $2; exit}' \
            gradle.properties)
          released_properties=$(git show \
            "$latest_tag:gradle.properties" 2>/dev/null || true)
          released_code=$(printf '%s\n' "$released_properties" | awk -F= \
            '$1 == "magicDeskVersionCode" {print $2; exit}')
          if [[ -z "$released_code" ]]; then
            released_code=$(git show "$latest_tag:app/build.gradle" \
              | awk '$1 == "versionCode" {print $3; exit}')
          fi
          highest_version=$(printf '%s\n%s\n' \
            "$released_version" "$current_version" | sort -V | tail -n 1)
          if [[ "$current_version" == "$released_version" \
                || "$highest_version" != "$current_version" ]]; then
            echo "::error::Development version $current_version must be newer than $released_version"
            exit 1
          fi
          if (( current_code <= released_code )); then
            echo "::error::Development versionCode $current_code must be greater than $released_code"
            exit 1
          fi
          printf 'Development %s (%s) follows %s (%s).\n' \
            "$current_version" "$current_code" \
            "$released_version" "$released_code"

      - name: Restore release keystore
        if: github.event_name == 'push'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.MAGICDESK_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          install -d -m 700 "$RUNNER_TEMP/magicdesk-signing"
          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/magicdesk-signing/release.jks"
          chmod 600 "$RUNNER_TEMP/magicdesk-signing/release.jks"

      - name: Lint and build signed main APK
        if: github.event_name == 'push'
        env:
          ORG_GRADLE_PROJECT_MAGICDESK_RELEASE_STORE_FILE: ${{ runner.temp }}/magicdesk-signing/release.jks
          ORG_GRADLE_PROJECT_MAGICDESK_RELEASE_STORE_PASSWORD: ${{ secrets.MAGICDESK_RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_MAGICDESK_RELEASE_KEY_ALIAS: ${{ secrets.MAGICDESK_RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_MAGICDESK_RELEASE_KEY_PASSWORD: ${{ secrets.MAGICDESK_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          short_sha=$(printf '%s' "$GITHUB_SHA" | cut -c1-7)
          version_suffix="dev.$GITHUB_RUN_NUMBER.$short_sha"
          ./gradlew --no-daemon \
            -PMAGICDESK_VERSION_SUFFIX="$version_suffix" \
            :app:testDebugUnitTest \
            :app:lintRelease \
            :kernel-fixes:lintRelease \
            :app:assembleRelease \
            :kernel-fixes:assembleRelease

      - name: Lint and build unsigned release APKs
        if: github.event_name != 'push'
        run: |
          ./gradlew --no-daemon \
            :app:testDebugUnitTest \
            :app:lintRelease \
            :kernel-fixes:lintRelease \
            :app:assembleRelease \
            :kernel-fixes:assembleRelease

      - name: Verify signed APK and package boundaries
        if: github.event_name == 'push'
        shell: bash
        run: |
          build_tools="$ANDROID_SDK_ROOT/build-tools/37.0.0"
          core_apk=app/build/outputs/apk/release/app-release.apk
          "$build_tools/apksigner" verify --verbose "$core_apk"
          ./scripts/verify-apks.sh \
            "$core_apk" \
            kernel-fixes/build/outputs/apk/release/kernel-fixes-release.apk

      - name: Verify unsigned APK boundaries
        if: github.event_name != 'push'
        run: |
          ./scripts/verify-apks.sh \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            kernel-fixes/build/outputs/apk/release/kernel-fixes-release-unsigned.apk

      - name: Prepare signed main artifact
        if: github.event_name == 'push'
        shell: bash
        run: |
          build_tools="$ANDROID_SDK_ROOT/build-tools/37.0.0"
          core_apk=app/build/outputs/apk/release/app-release.apk
          version=$("$build_tools/aapt2" dump badging "$core_apk" \
            | awk -F "versionName='" 'NR == 1 {split($2, value, "'\''"); print value[1]}')
          test -n "$version"
          mkdir -p dist
          cp "$core_apk" "dist/MagicDesk-$version.apk"
          printf 'commit=%s\nrun=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            > dist/BUILD.txt
          (
            cd dist
            sha256sum ./*.apk > SHA256SUMS
          )

      - name: Upload signed main APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: magicdesk-main-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: dist/

      - name: Upload unsigned CI APKs and lint reports
        if: github.event_name != 'push'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: magicdesk-ci-unsigned
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            kernel-fixes/build/outputs/apk/release/kernel-fixes-release-unsigned.apk
            app/build/reports/lint-results-release.html
            kernel-fixes/build/reports/lint-results-release.html
