name: Signed release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Verify release origin and version
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          tag_args=()
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag_args=(--tag "$GITHUB_REF_NAME")
          elif [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Manual signed release builds must run on main"
            exit 1
          fi
          python3 scripts/verify-version.py --channel release "${tag_args[@]}"

      - name: Require successful main CI
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          run=$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=main -f head_sha="$GITHUB_SHA" -f event=push \
            -f status=success -f per_page=1 --jq '.workflow_runs[0]')
          run_id=$(jq -r '.id // empty' <<< "$run")
          run_number=$(jq -r '.run_number // empty' <<< "$run")
          if [[ ! "$run_id" =~ ^[0-9]+$ || ! "$run_number" =~ ^[0-9]+$ ]]; then
            echo "::error::Run Android CI successfully on this exact main commit before releasing"
            exit 1
          fi
          printf 'run_id=%s\nrun_number=%s\n' "$run_id" "$run_number" >> "$GITHUB_OUTPUT"

      - name: Download verified main artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ steps.ci.outputs.run_id }}
          CI_RUN_NUMBER: ${{ steps.ci.outputs.run_number }}
        shell: bash
        run: |
          gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "magicdesk-main-$CI_RUN_NUMBER" --dir download
          test "$(sed -n 's/^commit=//p' download/BUILD.txt)" = "$GITHUB_SHA"
          test "$(sed -n 's/^run=//p' download/BUILD.txt)" = "$CI_RUN_ID"
          (cd download && sha256sum --check SHA256SUMS)

      - name: Verify signature and APK boundaries
        id: apk
        shell: bash
        run: |
          build_tools="$ANDROID_SDK_ROOT/build-tools/37.0.0"
          version=$(awk -F= '$1 == "magicDeskVersionName" {print $2}' gradle.properties)
          version_code=$(awk -F= '$1 == "magicDeskVersionCode" {print $2}' gradle.properties)
          core_apk="download/MagicDesk-$version.apk"
          test -f "$core_apk"
          "$build_tools/apksigner" verify --verbose "$core_apk"
          ./scripts/verify-apks.sh "$core_apk"
          badging=$("$build_tools/aapt2" dump badging "$core_apk")
          app_version=$(awk -F "versionName='" 'NR == 1 {split($2, value, "'\''"); print value[1]}' <<< "$badging")
          app_code=$(awk -F "versionCode='" 'NR == 1 {split($2, value, "'\''"); print value[1]}' <<< "$badging")
          test "$app_version" = "$version"
          test "$app_code" = "$version_code"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "$app_version" = "${GITHUB_REF_NAME#v}"
          fi
          printf 'path=%s\n' "$core_apk" >> "$GITHUB_OUTPUT"

      - name: Prepare release files
        id: files
        env:
          CORE_APK: ${{ steps.apk.outputs.path }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=${GITHUB_REF_NAME#v}
          else
            version=manual-${GITHUB_RUN_NUMBER}
          fi
          mkdir -p dist
          cp "$CORE_APK" "dist/MagicDesk-${version}.apk"
          cp download/MagicDesk-source.tar.gz "dist/MagicDesk-${version}-source.tar.gz"
          (
            cd dist
            sha256sum ./*.apk ./*-source.tar.gz > SHA256SUMS
          )
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Upload signed artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: magicdesk-signed-${{ steps.files.outputs.version }}
          if-no-files-found: error
          retention-days: 30
          path: dist/

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          notes_file="docs/releases/${{ steps.files.outputs.version }}.md"
          if [[ -f "$notes_file" ]]; then
            notes=(--notes-file "$notes_file")
          else
            notes=(--generate-notes)
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            if [[ ! -f "$notes_file" ]]; then
              notes=()
            fi
            gh release edit "$GITHUB_REF_NAME" \
              "${notes[@]}" \
              --title "MagicDesk $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              "${notes[@]}" \
              --title "MagicDesk $GITHUB_REF_NAME" \
              dist/*
          fi
