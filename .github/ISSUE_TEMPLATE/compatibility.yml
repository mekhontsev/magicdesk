name: Firmware compatibility problem
description: Report a reproducible MagicDesk failure on ZTE, nubia, or RedMagic Android 16+
title: "[Compatibility] "
labels:
  - compatibility
body:
  - type: markdown
    attributes:
      value: |
        Reproduce the problem, open **Tools > Diagnostics**, press **Refresh**,
        and attach the complete report below. Review it before publishing.
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the exact actions from a clean MagicDesk start.
      placeholder: |
        1. Connect ...
        2. Start Console Mode ...
        3. Open ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include the on-screen MagicDesk error code if one appeared.
    validations:
      required: true
  - type: dropdown
    id: stock
    attributes:
      label: Stock ZTE/Nubia desktop behavior
      options:
        - The same operation works in the stock UI
        - The same operation also fails in the stock UI
        - The stock UI does not provide this operation
        - Not tested
    validations:
      required: true
  - type: textarea
    id: peripherals
    attributes:
      label: External display and input devices
      description: Monitor/glasses, keyboard, mouse, touchpad, dock, and adapters involved.
  - type: textarea
    id: report
    attributes:
      label: MagicDesk diagnostics report
      render: text
      description: Paste the complete report from Tools > Diagnostics.
    validations:
      required: true
