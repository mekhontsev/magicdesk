plugins {
    id 'com.android.application' version '9.2.1' apply false
    id 'com.android.library' version '9.2.1' apply false
}

tasks.register('verifyDevelopment') {
    group = 'verification'
    description = 'Runs local checks and builds all debug APKs.'
    dependsOn ':display-mode-core:test',
            ':app:testDebugUnitTest',
            ':app:lintDebug',
            ':app:assembleDebug',
            ':display-fixes:testDebugUnitTest',
            ':display-fixes:lintDebug',
            ':display-fixes:assembleDebug',
            ':kernel-fixes:lintDebug',
            ':kernel-fixes:assembleDebug'
}
