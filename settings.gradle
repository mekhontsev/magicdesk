pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'MagicDesk'
include ':app'
include ':hidden-api-stubs'
include ':kernel-fixes'
include ':terminal-emulator'
include ':x11-runtime', ':x11-stubs'
project(':x11-runtime').projectDir = file('vendor/magicdesk-x11/embedded')
project(':x11-stubs').projectDir = file('vendor/magicdesk-x11/shell-loader/stub')
