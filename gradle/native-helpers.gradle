def termuxPrefix = System.getenv('PREFIX')
def termuxCompiler = termuxPrefix == null
        ? null : file("${termuxPrefix}/bin/clang")
def nativeOutputRoot = layout.buildDirectory
        .dir('generated/magicdeskNative').get().asFile
def nativeTarget = "aarch64-linux-android${android.defaultConfig.minSdk}"

android.sourceSets.main.jniLibs.srcDir nativeOutputRoot

def readLocalProperties = {
    def properties = new Properties()
    def propertiesFile = rootProject.file('local.properties')
    if (propertiesFile.isFile()) {
        propertiesFile.withInputStream { properties.load(it) }
    }
    return properties
}

def findNdkHomes = {
    def explicitHome = System.getenv('ANDROID_NDK_HOME')
            ?: System.getenv('ANDROID_NDK_ROOT')
    if (explicitHome != null && !explicitHome.isBlank()) {
        return [file(explicitHome)]
    }

    def localProperties = readLocalProperties()
    def sdkHome = localProperties.getProperty('sdk.dir')
            ?: System.getenv('ANDROID_SDK_ROOT')
            ?: System.getenv('ANDROID_HOME')
    if (sdkHome == null || sdkHome.isBlank()) {
        return []
    }

    return [file("${sdkHome}/ndk/${android.ndkVersion}")]
}

def resolveNativeCompilerCommand = {
    if (termuxCompiler?.isFile()
            && termuxPrefix.startsWith('/data/data/com.termux/')) {
        return [termuxCompiler.absolutePath, "--target=${nativeTarget}".toString()]
    }

    def osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
    def hostPrefix
    def compilerName = 'clang'
    if (osName.contains('win')) {
        hostPrefix = 'windows-'
        compilerName = 'clang.exe'
    } else if (osName.contains('mac') || osName.contains('darwin')) {
        hostPrefix = 'darwin-'
    } else if (osName.contains('linux')) {
        hostPrefix = 'linux-'
    } else {
        throw new GradleException("Unsupported native build host: ${osName}")
    }

    for (def ndkHome : findNdkHomes()) {
        def prebuiltRoot = new File(ndkHome,
                'toolchains/llvm/prebuilt')
        def toolchain = prebuiltRoot.listFiles()?.find {
            it.isDirectory() && it.name.startsWith(hostPrefix)
        }
        def compiler = toolchain == null ? null
                : new File(toolchain, "bin/${compilerName}")
        if (compiler?.isFile()) {
            return [compiler.absolutePath,
                    "--target=${nativeTarget}".toString()]
        }
    }

    throw new GradleException("Android NDK ${android.ndkVersion} was not "
            + 'found; install NDK (Side by side) in Android Studio or set '
            + 'ANDROID_NDK_HOME')
}

def registerNativeHelper = { String taskName, String sourceName,
        String outputName, boolean staticExecutable = false ->
    def source = rootProject.file("native/${sourceName}")
    def output = new File(nativeOutputRoot, "arm64-v8a/${outputName}")
    tasks.register(taskName, Exec) {
        inputs.file(source)
        inputs.property('nativeTarget', nativeTarget)
        inputs.property('staticExecutable', staticExecutable)
        outputs.file(output)
        doFirst {
            output.parentFile.mkdirs()
            def sources = [source.absolutePath]
            commandLine resolveNativeCompilerCommand() + [
                    '-std=c17', '-O2', '-Wall', '-Wextra', '-Werror',
                    '-Wl,-z,noexecstack', '-o', output.absolutePath] +
                    (staticExecutable ? ['-static', '-fno-pie'] : ['-fPIE', '-pie']) + sources
        }
    }
}

def uinputTask = registerNativeHelper(
        'buildMagicDeskUinputBridge',
        'magicdesk_uinput_bridge.c',
        'libmagicdesk_uinput_bridge.so')
def ptyTask = registerNativeHelper(
        'buildMagicDeskPtyBridge',
        'magicdesk_pty_bridge.c',
        'libmagicdesk_pty_bridge.so')
ptyTask.configure {
    inputs.file(rootProject.file('native/magicdesk_pipe_shell.h'))
}
def serviceTask = registerNativeHelper(
        'buildMagicDeskServiceLauncher',
        'magicdesk_service_launcher.c',
        'libmagicdesk_service_launcher.so')
def processSignalTask = registerNativeHelper(
        'buildMagicDeskProcessSignal',
        'magicdesk_process_signal.c',
        'libmagicdesk_process_signal.so')
def guestFilesTask = registerNativeHelper(
        'buildMagicDeskGuestFiles', 'magicdesk_guest_files.c', 'libmagicdesk_guest_files.so', true)

def cmakeAndroidTarget = {
    def compiler = resolveNativeCompilerCommand()
    termuxCompiler?.isFile() ? [
            "-DCMAKE_C_COMPILER=${compiler[0]}", "-DCMAKE_ASM_COMPILER=${compiler[0]}",
            "-DCMAKE_C_FLAGS=${compiler[1]}", "-DCMAKE_ASM_FLAGS=${compiler[1]}",
            '-DCMAKE_EXE_LINKER_FLAGS=-fno-termux-rpath'
    ] : [
            "-DCMAKE_TOOLCHAIN_FILE=${findNdkHomes()[0]}/build/cmake/android.toolchain.cmake",
            '-DANDROID_ABI=arm64-v8a', "-DANDROID_PLATFORM=android-${android.defaultConfig.minSdk}"
    ]
}

def guestBuild = layout.buildDirectory.dir('guestRuntime').get().asFile
def configureGuest = tasks.register('configureGuestRuntime', Exec) {
    inputs.file rootProject.file('native/guest-runtime/CMakeLists.txt')
    inputs.property 'nativeTarget', nativeTarget
    outputs.file new File(guestBuild, 'build.ninja')
    doFirst {
        commandLine(['cmake', '-S', rootProject.file('native/guest-runtime'), '-B', guestBuild,
                '-G', 'Ninja'] + cmakeAndroidTarget())
    }
}
def buildGuest = tasks.register('buildGuestRuntime', Exec) {
    dependsOn configureGuest
    commandLine 'cmake', '--build', guestBuild, '--parallel', '2'
}
def packageGuest = tasks.register('packageGuestRuntime', Copy) {
    dependsOn buildGuest
    from(guestBuild) { include 'libmagicdesk_guest_bootstrap.so', 'libmagicdesk_guest_supervisor.so', 'libmagicdesk_guest_run.so', 'libmagicdesk_guest_service.so' }
    into new File(nativeOutputRoot, 'arm64-v8a')
}

def settingsBuild = layout.buildDirectory.dir('linuxSettings').get().asFile
def settingsLicenses = layout.buildDirectory.dir('linuxSettingsLicenses').get().asFile
android.sourceSets.main.assets.srcDir settingsLicenses
def configureSettings = tasks.register('configureLinuxSettings', Exec) {
    inputs.files rootProject.fileTree('native/linux-settings')
    outputs.file new File(settingsBuild, 'build.ninja')
    doFirst {
        def localMeson = rootProject.file('build/wayland-tools/bin/meson')
        def meson = providers.gradleProperty('magicDeskMeson').orElse(localMeson.isFile() ? localMeson.path : 'meson').get()
        commandLine(['cmake', '-S', rootProject.file('native/linux-settings'), '-B', settingsBuild,
                '-G', 'Ninja', "-DMESON=${meson}"] + cmakeAndroidTarget())
    }
}
def buildSettings = tasks.register('buildLinuxSettings', Exec) {
    dependsOn configureSettings
    commandLine 'cmake', '--build', settingsBuild, '--parallel', '2'
}
def packageSettings = tasks.register('packageLinuxSettings', Copy) {
    dependsOn buildSettings
    from new File(settingsBuild, 'libmagicdesk_linux_settings.so')
    into new File(nativeOutputRoot, 'arm64-v8a')
}
def packageSettingsLicenses = tasks.register('packageLinuxSettingsLicenses', Sync) {
    dependsOn buildSettings
    from new File(settingsBuild, 'prefix/licenses/dbus')
    into new File(settingsLicenses, 'licenses/dbus')
}

tasks.named('preBuild').configure {
    dependsOn uinputTask, ptyTask, serviceTask, processSignalTask, guestFilesTask, packageGuest, packageSettings, packageSettingsLicenses
}
