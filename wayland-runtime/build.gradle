plugins { id 'com.android.library' }

def termux = System.getenv('PREFIX')?.startsWith('/data/data/') && file("${System.getenv('PREFIX')}/bin/clang").isFile()
def nativeDirectory = layout.buildDirectory.dir('renderer').get().asFile
def jniDirectory = layout.buildDirectory.dir('jniLibs').get().asFile
def dependencyDirectory = rootProject.layout.buildDirectory.dir('wayland-deps').get().asFile
def runtimePrefix = termux ? new File(dependencyDirectory, 'prefix')
    : file(providers.gradleProperty('magicDeskWaylandRuntime').orElse('build/missing-runtime').get())
def licenseAssets = layout.buildDirectory.dir('licenseAssets').get().asFile
def localMeson = rootProject.file('build/wayland-tools/bin/meson')
def meson = providers.gradleProperty('magicDeskMeson').orElse(localMeson.isFile() ? localMeson.path : 'meson').get()

android {
    namespace 'io.github.mekhontsev.magicdesk.wayland'
    compileSdk 37
    ndkVersion '27.3.13750724'
    defaultConfig {
        minSdk 34
        ndk { abiFilters 'arm64-v8a' }
        consumerProguardFiles 'consumer-rules.pro'
    }
    buildFeatures { aidl true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.jniLibs.srcDir jniDirectory
    sourceSets.main.assets.srcDir licenseAssets
    if (!termux) externalNativeBuild { cmake { path 'src/main/renderer/CMakeLists.txt' } }
}

dependencies {
    implementation project(':hosted-runtime')
    testImplementation 'junit:junit:4.13.2'
}

def verifyRuntime = tasks.register('verifyRuntime', Exec) {
    doFirst {
        if (!new File(runtimePrefix, 'lib/libmagicdesk_wayland_executor.so').isFile()
            || !new File(runtimePrefix, 'lib/libmagicdesk_wayland_client.so').isFile()
                || !new File(runtimePrefix, 'licenses/wlroots/LICENSE').isFile())
            throw new GradleException('A standalone arm64 API 34 Wayland runtime with licenses is required; set magicDeskWaylandRuntime to its prefix.')
    }
    commandLine 'cmake', "-DLIBRARY=${runtimePrefix}/lib/libmagicdesk_wayland_executor.so",
            '-P', file('native-deps/verify-runtime.cmake')
}
def collectLicenses = tasks.register('collectLicenses', Sync) {
    dependsOn verifyRuntime
    from new File(runtimePrefix, 'licenses')
    into new File(licenseAssets, 'licenses/wayland')
}
def packageNative = tasks.register('packageNative', Sync) {
    dependsOn verifyRuntime
    from new File(runtimePrefix, 'lib/libmagicdesk_wayland_executor.so')
    from new File(runtimePrefix, 'lib/libmagicdesk_wayland_client.so')
    into new File(jniDirectory, 'arm64-v8a')
}
tasks.named('preBuild').configure { dependsOn packageNative, collectLicenses }

if (termux) {
    def configureDependencies = tasks.register('configureDependencies', Exec) {
        inputs.files fileTree('native-deps')
        inputs.property 'meson', meson
        outputs.file new File(dependencyDirectory, 'build.ninja')
        commandLine 'cmake', '-S', file('native-deps'), '-B', dependencyDirectory, '-G', 'Ninja',
                '-DCMAKE_C_COMPILER=clang', '-DCMAKE_C_FLAGS=--target=aarch64-linux-android34',
                '-DCMAKE_EXE_LINKER_FLAGS=-fno-termux-rpath', "-DMESON=${meson}"
    }
    def buildDependencies = tasks.register('buildDependencies', Exec) {
        dependsOn configureDependencies
        commandLine 'cmake', '--build', dependencyDirectory, '--parallel', '2'
    }
    verifyRuntime.configure { dependsOn buildDependencies }
    def configureRenderer = tasks.register('configureRenderer', Exec) {
        inputs.file 'src/main/renderer/CMakeLists.txt'
        outputs.file new File(nativeDirectory, 'build.ninja')
        commandLine 'cmake', '-S', file('src/main/renderer'), '-B', nativeDirectory, '-G', 'Ninja',
                '-DCMAKE_C_COMPILER=clang', '-DCMAKE_C_FLAGS=--target=aarch64-linux-android34',
                "-DJNI_INCLUDE_DIR=${System.getProperty('java.home')}/include",
                '-DCMAKE_SHARED_LINKER_FLAGS=-L/system/lib64 -fno-termux-rpath -Wl,-z,max-page-size=16384'
    }
    def buildRenderer = tasks.register('buildRenderer', Exec) {
        dependsOn configureRenderer
        commandLine 'cmake', '--build', nativeDirectory, '-j', '4'
    }
    packageNative.configure {
        dependsOn buildRenderer
        from new File(nativeDirectory, 'libmagicdesk_wayland_host.so')
    }
}