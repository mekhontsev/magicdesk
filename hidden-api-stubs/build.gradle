plugins {
    id 'java-library'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.isFile()) {
    localPropertiesFile.withInputStream {
        localProperties.load(it)
    }
}
def androidSdk = localProperties.getProperty('sdk.dir')
        ?: System.getenv('ANDROID_SDK_ROOT')
        ?: System.getenv('ANDROID_HOME')
if (androidSdk == null || androidSdk.isBlank()) {
    throw new GradleException(
            'Android SDK not found; configure sdk.dir or ANDROID_SDK_ROOT')
}

dependencies {
    compileOnly files("${androidSdk}/platforms/android-36/android.jar")
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
